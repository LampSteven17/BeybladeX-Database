name: Refresh Parts Catalog (Weekly)

# Re-runs the Fandom wiki scraper once a week to pick up any new Beyblade X
# parts (lock chips, main blades, over blades, assists, bits, ratchets) that
# Takara Tomy releases. Updates parts_catalog table + parts_catalog.json so
# the parser and the website automatically recognize the new parts.
#
# Manual trigger: Actions → "Refresh Parts Catalog (Weekly)" → Run workflow
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays at 06:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Refresh parts catalog from Fandom wiki
        run: uv run python scripts/refresh_all.py --sources fandom -v
        # Note: refresh_all.py:fandom calls populate_parts_catalog which always
        # re-scrapes Category pages directly. The cached URL list at
        # data/ragflow_ingest_urls.json is only used by ragflow_ingest.py and
        # is refreshed by the separate refresh-ragflow.yml workflow.

      - name: Show catalog summary
        run: |
          uv run python -c "
          import sys; sys.path.insert(0, 'scripts')
          from db import get_connection
          conn = get_connection(read_only=True)
          for row in conn.execute('''
              SELECT part_type, COUNT(*) FROM parts_catalog
              WHERE status = 'accepted' GROUP BY part_type ORDER BY part_type
          ''').fetchall():
              print(f'  {row[0]:12} {row[1]}')
          "

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/data/beyblade.duckdb site/public/data/parts_catalog.json
          if git diff --staged --quiet; then
            echo "No catalog changes — wiki has no new parts this week."
          else
            git commit -m "Refresh parts catalog from Fandom wiki (weekly cron)"
            git push
          fi
